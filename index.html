<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROTA 27</title>
<meta name="description" content="Planejamento da viagem de julho de 2027 — sete rotas, um mapa, uma decisão.">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
/* ============================================================
   ROTA 27 · v02 · app de mapa
   Paleta "Aço gelo" (design-mimar) · UI em tinta, cor só nas rotas
   Base 19px · contraste para monitor de luz azul reduzida
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
:root {
  color-scheme: light;
  --bg: #F4F6F8; --surface: #FFFFFF; --surface-2: #EEF1F4; --surface-3: #E4E8ED;
  --line: rgba(16,21,28,0.10); --line-2: rgba(16,21,28,0.18);
  --ink: #10151C; --ink-2: #3B4653; --ink-3: #5B6674;
  --primary: #10151C; --on-primary: #FFFFFF;
  --accent: #FF5722; --ok: #0F8A5F; --warn: #B45309; --neg: #C62828;
  --glass: rgba(255,255,255,0.94); --shadow: 0 8px 28px rgba(16,21,28,0.10), 0 1px 2px rgba(16,21,28,0.06);
  --casing: #FFFFFF; --scrim: rgba(16,21,28,0.5);
  --font-display: "Clash Display", "Satoshi", system-ui, sans-serif;
  --font-body: "Satoshi", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --fs-sec: .85rem; --fs-label: .8rem;
  --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px;
  --r-lg: 22px; --r: 14px; --r-sm: 10px;
  --ease: 200ms cubic-bezier(.2,.7,.2,1);
  --bar-h: 64px; --panel-w: 440px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1318; --surface: #161B22; --surface-2: #1D242D; --surface-3: #262E39;
  --line: rgba(237,239,242,0.10); --line-2: rgba(237,239,242,0.20);
  --ink: #EDEFF2; --ink-2: rgba(237,239,242,0.82); --ink-3: rgba(237,239,242,0.58);
  --primary: #EDEFF2; --on-primary: #0F1318;
  --glass: rgba(22,27,34,0.92); --shadow: 0 8px 28px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.4);
  --casing: #0F1318; --scrim: rgba(0,0,0,0.6);
}
html { font-size: 19px; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; text-rendering: optimizeLegibility; height: 100dvh; overflow: hidden; }
svg { display: block; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic--s { width: 16px; height: 16px; }
.lbl { font-size: var(--fs-label); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); }

/* ---------- controles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: var(--fs-sec); font-weight: 700; transition: background var(--ease), border-color var(--ease), transform var(--ease); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn--primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn--primary:hover { background: var(--primary); opacity: .9; }
.btn--ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn--icon { width: 44px; height: 44px; padding: 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); }
.field input, .field textarea { width: 100%; min-height: 46px; padding: 11px 13px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); font-size: var(--fs-sec); }
.field input:focus, .field textarea:focus { outline: 2px solid var(--ink); outline-offset: 0; border-color: var(--ink); }
.field textarea { min-height: 88px; resize: vertical; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.seg button { min-height: 38px; padding: 6px 14px; border-radius: 999px; font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16,21,28,.12); }
.err { color: var(--neg); font-size: var(--fs-sec); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.chip--ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.chip--accent { background: var(--accent); color: #fff; }
.chip--warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rc, var(--ink)); flex: none; }

/* ---------- gate ---------- */
.gate { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: var(--bg); padding: var(--s4); }
.gate__card { width: min(100%, 400px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); display: grid; gap: var(--s3); box-shadow: var(--shadow); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -.01em; display: inline-flex; align-items: baseline; gap: 2px; }
.brand em { font-style: normal; color: var(--accent); }
.gate__meta { color: var(--ink-2); font-size: var(--fs-sec); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: var(--bar-h) 1fr; height: 100dvh; }
.bar { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
.bar__spacer { flex: 1; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.tabs button { min-height: 40px; padding: 6px 16px; border-radius: 999px; font-size: var(--fs-sec); font-weight: 700; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--on-primary); }
.who { display: inline-flex; align-items: center; gap: 8px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: .9rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-2); }
.avatar--me { background: var(--ink); color: var(--on-primary); border-color: var(--ink); }
.who button.avatar { cursor: pointer; }
.who__name { font-size: var(--fs-sec); font-weight: 700; color: var(--ink-2); }

.body { display: grid; grid-template-columns: var(--panel-w) 1fr; min-height: 0; }
.body[data-view="comparar"] { --panel-w: 560px; }
.panel { position: relative; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; display: flex; flex-direction: column; }
.panel__handle { display: none; }
.stage { position: relative; min-height: 0; background: var(--surface-2); }
#map { position: absolute; inset: 0; }
:root[data-theme="dark"] .maplibregl-canvas { filter: invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.6); }
.maplibregl-ctrl-attrib { font-size: var(--fs-label) !important; background: var(--glass) !important; color: var(--ink-2) !important; }
.maplibregl-ctrl-attrib a { color: var(--ink-2) !important; }
.maplibregl-ctrl-group { background: var(--surface) !important; box-shadow: var(--shadow) !important; border-radius: var(--r-sm) !important; overflow: hidden; }
.maplibregl-ctrl-group button { width: 44px !important; height: 44px !important; }
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--line) !important; }
.maplibregl-ctrl-group button span { filter: none !important; }
:root[data-theme="dark"] .maplibregl-ctrl-group button span { filter: invert(1) !important; }
.maplibregl-popup-content { background: var(--surface) !important; color: var(--ink) !important; border-radius: var(--r-sm) !important; box-shadow: var(--shadow) !important; padding: 8px 12px !important; font-size: var(--fs-label); font-weight: 700; }
.maplibregl-popup-tip { border-top-color: var(--surface) !important; }

/* pins */
.pin { --rc: var(--ink); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ink); border: 2.5px solid var(--rc); font-family: var(--font-mono); font-size: .8rem; font-weight: 600; box-shadow: 0 2px 8px rgba(16,21,28,.25); cursor: pointer; transition: transform var(--ease), background var(--ease), color var(--ease); }
.pin:hover { transform: scale(1.12); }
.pin.is-active { background: var(--rc); color: #fff; transform: scale(1.25); z-index: 5; }
.pin--gate { width: 34px; height: 34px; background: var(--ink); color: #fff; border-color: var(--surface); }
.pin--gate .ic { width: 18px; height: 18px; }
.pin--gate.is-active { background: var(--accent); }
.pin--dim { opacity: .35 !important; }

/* overlays no mapa */
.map-top { position: absolute; z-index: 10; left: var(--s3); top: var(--s3); right: 64px; display: flex; gap: var(--s2); align-items: flex-start; pointer-events: none; }
.map-top > * { pointer-events: auto; }
.route-card { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--shadow); max-width: 42ch; }
.route-card__t { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; display: flex; align-items: center; gap: 10px; }
.route-card__s { color: var(--ink-2); font-size: var(--fs-sec); margin-top: 2px; }
.map-actions { position: absolute; z-index: 10; right: var(--s3); bottom: 120px; display: grid; gap: 8px; }
.map-actions .btn { box-shadow: var(--shadow); }
.legend { position: absolute; z-index: 10; left: var(--s3); bottom: var(--s3); display: flex; gap: var(--s3); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); box-shadow: var(--shadow); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 3px solid var(--ink); }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { border-top-style: dotted; }

/* ---------- painel: cabeçalho da rota ---------- */
.rh { padding: var(--s3) var(--s3) var(--s2); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 3; }
.rsel { position: relative; }
.rsel__btn { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px 8px 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); text-align: left; }
.rsel__btn:hover { background: var(--surface-2); }
.rsel__txt { flex: 1; min-width: 0; }
.rsel__name, .rsel__sub { display: block; }
.rsel__sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsel__name { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.1; }
.rsel__sub { color: var(--ink-2); font-size: var(--fs-label); font-weight: 500; margin-top: 2px; }
.rsel__chev { margin-left: auto; color: var(--ink-3); transition: transform var(--ease); }
.rsel[data-open="true"] .rsel__chev { transform: rotate(180deg); }
.rsel__list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; z-index: 30; display: grid; gap: 2px; transform-origin: top; animation: pop 160ms var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: scale(.98) translateY(-4px); } to { opacity: 1; transform: none; } }
.rsel__opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 10px; border-radius: var(--r-sm); text-align: left; width: 100%; }
.rsel__opt:hover, .rsel__opt:focus-visible { background: var(--surface-2); outline: none; }
.rsel__opt[aria-selected="true"] { background: var(--surface-2); }
.rsel__opt b { font-weight: 700; font-size: var(--fs-sec); }
.rsel__opt small { display: block; color: var(--ink-3); font-size: var(--fs-label); font-weight: 500; }
.stats { display: flex; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s2); }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.05rem; font-weight: 600; }
.stat span { font-size: var(--fs-label); color: var(--ink-3); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

/* ---------- linha do tempo ---------- */
.tl { padding: var(--s2) 0 var(--s6); }
.day { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 0 var(--s2); padding: var(--s3) var(--s3) var(--s3) 0; border-left: 4px solid transparent; transition: background var(--ease), border-color var(--ease); cursor: pointer; }
.day:hover { background: var(--surface-2); }
.day.is-active { background: color-mix(in srgb, var(--rc) 7%, var(--surface)); border-left-color: var(--rc); }
.day__date { text-align: center; padding-top: 2px; }
.day__num { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1; }
.day__wd { font-size: var(--fs-label); font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.day__idx { display: inline-block; margin-top: 8px; font-family: var(--font-mono); font-size: .75rem; font-weight: 600; color: var(--ink-3); background: var(--surface-2); border-radius: 999px; padding: 2px 7px; }
.day.is-active .day__idx { background: var(--rc); color: #fff; }
.day__body { min-width: 0; }
.day__kind { font-size: var(--fs-label); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.day__kind .ic { color: var(--rc); }
.day__title { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; margin-top: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.day__title .chip { height: 24px; font-size: .75rem; }
.moves { display: grid; gap: 6px; margin-top: 10px; }
.move { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-sec); }
.move .ic { color: var(--rc); }
.move__t { font-weight: 700; }
.move__c { color: var(--ink-3); font-size: var(--fs-label); font-weight: 500; }
.move__d { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.move--side { background: transparent; border: 1px dashed var(--line-2); }
.day ul { margin-top: 10px; padding-left: 18px; color: var(--ink-2); font-size: var(--fs-sec); display: grid; gap: 4px; }
.day ul li::marker { color: var(--rc); }
.day__foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.ideas { display: grid; gap: 8px; margin-top: 10px; }
.idea { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sec); }
.idea__kind { font-size: var(--fs-label); font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.idea__t { font-weight: 700; }
.idea__b { color: var(--ink-2); }
.idea__b a { color: var(--ink); font-weight: 700; }
.idea__amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.avatar--xs { width: 28px; height: 28px; font-size: .75rem; }
.idea-form { display: grid; gap: 10px; margin-top: 10px; padding: 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); }
.idea-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.idea-form__act { display: flex; gap: 8px; justify-content: flex-end; }
.guide { margin-top: 12px; display: grid; gap: 10px; }
.guide__cover { position: relative; border-radius: var(--r); overflow: hidden; background: var(--surface-2); aspect-ratio: 16/9; margin: 0; }
.guide__cover.no-img { background: repeating-linear-gradient(135deg, var(--surface-2) 0 12px, var(--surface-3) 12px 14px); }
.guide__cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.guide__cover figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 8px; font-size: var(--fs-label); font-weight: 700; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.65)); }
.guide__cover figcaption a { color: #fff; font-weight: 500; }
.guide__why { font-size: var(--fs-sec); color: var(--ink); line-height: 1.5; padding-left: 12px; border-left: 3px solid var(--rc); }
.hl-row { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin-right: -16px; padding-right: 16px; scrollbar-width: thin; }
.hl { flex: 0 0 210px; scroll-snap-align: start; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); overflow: hidden; text-decoration: none; color: inherit; transition: border-color var(--ease), box-shadow var(--ease); }
.hl:hover { border-color: var(--rc); box-shadow: var(--shadow); }
.hl__img { aspect-ratio: 4/3; background: var(--surface-2); object-fit: cover; width: 100%; display: block; }
.hl__b { padding: 8px 10px 10px; }
.hl__n { font-weight: 700; font-size: var(--fs-sec); }
.hl__t { color: var(--ink-2); font-size: var(--fs-label); margin-top: 2px; line-height: 1.35; }
.hl__x { color: var(--ink-3); font-size: var(--fs-label); margin-top: 6px; line-height: 1.35; min-height: 4.05em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.guide__links { display: flex; gap: 6px; flex-wrap: wrap; }
.guide__links a { text-decoration: none; }
.guide__links a:hover { background: var(--surface-3); color: var(--ink); }
.risks { margin: var(--s2) var(--s3) 0; padding: 12px 14px; border-radius: var(--r); border: 1px dashed var(--line-2); }
.risks .lbl { color: var(--warn); }
.risks ul { padding-left: 18px; margin-top: 6px; color: var(--ink-2); font-size: var(--fs-sec); display: grid; gap: 4px; }

/* ---------- trechos ---------- */
.legs { padding: var(--s2) var(--s3) var(--s6); display: grid; gap: 8px; }
.legrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: background var(--ease), border-color var(--ease); }
.legrow:hover, .legrow.is-active { background: color-mix(in srgb, var(--rc) 7%, var(--surface)); border-color: var(--rc); }
.legrow .ic { color: var(--rc); }
.legrow__t { font-weight: 700; font-size: var(--fs-sec); }
.legrow__c { color: var(--ink-3); font-size: var(--fs-label); font-weight: 500; }
.legrow__d { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.legrow__n { font-family: var(--font-mono); font-size: .75rem; color: var(--ink-3); text-align: center; }

/* ---------- comparar ---------- */
.cmp { padding: var(--s3); display: grid; gap: var(--s3); }
.cmp__intro { color: var(--ink-2); font-size: var(--fs-sec); }
.card { --rc: var(--ink); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: var(--s3); position: relative; overflow: hidden; transition: border-color var(--ease), box-shadow var(--ease); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--rc); }
.card:hover { border-color: var(--rc); box-shadow: var(--shadow); }
.card--top { border-color: var(--ink); }
.card__h { display: flex; align-items: flex-start; gap: 10px; padding-left: 8px; }
.card__name { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.1; }
.card__sub { color: var(--ink-2); font-size: var(--fs-label); font-weight: 500; margin-top: 2px; }
.card__sig { font-style: italic; color: var(--ink-2); font-size: var(--fs-sec); margin: 8px 0 0 8px; }
.card__stats { display: flex; gap: var(--s3); flex-wrap: wrap; margin: 12px 0 0 8px; }
.crit { display: grid; gap: 6px; margin: 14px 0 0 8px; }
.crit__row { display: grid; grid-template-columns: 1fr 120px 24px; gap: 10px; align-items: center; font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); }
.meter { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; width: calc(var(--v) * 20%); background: var(--rc); border-radius: 999px; }
.meter[data-v="1"] i, .meter[data-v="2"] i { background: var(--warn); }
.crit__v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.card__act { display: flex; gap: 8px; margin: 14px 0 0 8px; flex-wrap: wrap; }
.card__risk { color: var(--ink-3); font-size: var(--fs-label); margin: 10px 0 0 8px; }

/* ---------- decidir ---------- */
.dec { padding: var(--s3); display: grid; gap: var(--s4); }
.dec h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin-bottom: 8px; }
.votes { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; align-items: center; }
.votes .vh { text-align: center; }
.vrow { display: contents; }
.vname { display: flex; align-items: center; gap: 10px; padding: 8px 6px; font-size: var(--fs-sec); font-weight: 700; }
.heart { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); color: var(--ink-3); margin: 0 auto; background: var(--surface); }
.heart:not([disabled]):hover { border-color: var(--accent); color: var(--accent); }
.heart[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.heart[aria-pressed="true"] .ic { fill: currentColor; }
.heart[disabled] { cursor: default; }
.notecard { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); font-size: var(--fs-sec); }
.notecard__h { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; }
.notecard p { color: var(--ink-2); white-space: pre-wrap; }
.inbox { display: grid; gap: 10px; }
.inbox__g { font-size: var(--fs-label); font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.empty { color: var(--ink-3); font-size: var(--fs-sec); }
.foot { padding: var(--s3); color: var(--ink-3); font-size: var(--fs-label); border-top: 1px solid var(--line); }

/* ---------- mobile: bottom sheet ---------- */
@media (max-width: 900px) {
  :root { --bar-h: 112px; }
  .app { grid-template-rows: var(--bar-h) 1fr; }
  .bar { flex-wrap: wrap; padding: 10px var(--s3) 8px; row-gap: 8px; align-content: center; }
  .bar__spacer:first-of-type { flex: 1; }
  .bar__spacer:last-of-type { display: none; }
  .tabs { order: 10; width: 100%; justify-content: space-between; }
  .tabs button { flex: 1; padding: 6px 4px; font-size: var(--fs-label); }
  
  .who__name { display: none; }
  .body, .body[data-view="comparar"] { grid-template-columns: 1fr; grid-template-rows: 1fr; position: relative; }
  .stage { position: absolute; inset: 0; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 54dvh; border-right: 0; border-top: 1px solid var(--line); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: 0 -10px 30px rgba(16,21,28,.18); transition: height 260ms var(--ease); z-index: 15; }
  .panel[data-sheet="full"] { height: calc(100dvh - var(--bar-h) - 12px); }
  .panel[data-sheet="peek"] { height: 132px; overflow: hidden; }
  .panel__handle { display: grid; place-items: center; height: 26px; flex: none; cursor: grab; touch-action: none; position: sticky; top: 0; background: var(--surface); z-index: 4; }
  .panel__handle i { width: 44px; height: 5px; border-radius: 999px; background: var(--line-2); }
  .rh { top: 26px; }
  .map-actions { bottom: calc(54dvh + 12px); transition: bottom 260ms var(--ease); }
  .legend { display: none; }
  .map-top { right: var(--s3); }
  .route-card { display: none; }
  .day { grid-template-columns: 56px 1fr; }
  .idea-form__row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script>
(() => {
  'use strict';
  const CFG = window.ROTA27_CONFIG || { backend: 'local' };
  const qs = new URLSearchParams(location.search);
  const MODE = qs.get('backend') || CFG.backend || 'local';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const icon = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const MODEI = { plane: ['i-plane', 'avião'], train: ['i-train', 'trem'], bus: ['i-bus', 'ônibus'], ferry: ['i-ferry', 'balsa'], car: ['i-car', 'carro'], hike: ['i-hike', 'a pé'] };
  const mIcon = (m, cls) => icon(MODEI[m][0], cls);
  const fmtMin = (m) => { const h = Math.floor(m / 60), mm = m % 60; return h ? `${h}h${String(mm).padStart(2, '0')}` : `${mm} min`; };
  const KINDS = { ideia: 'Ideia', custo: 'Custo', hotel: 'Hotel', duvida: 'Dúvida' };
  const PEOPLE = { andre: { initial: 'A', name: 'André' }, rapha: { initial: 'R', name: 'Raphaella' } };
  const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const PALETTE = {
    fogo:     ['#D93B2B', '#F0644F'], epiro:    ['#0E8C7F', '#3FBFAF'], albania:  ['#5A8A16', '#9CCB3D'],
    dalmata:  ['#2F6BE0', '#6B9BFF'], vertical: ['#7A3FE0', '#B08CFF'], egeu:     ['#C77700', '#F2B84B'], jonico: ['#D1367A', '#F27BB0']
  };
  const STATUS = { recomendado: 'chip--accent', finalista: 'chip--ok', surpresa: 'chip--ok', sobrevivente: '', fria: '', condicional: 'chip--warn' };

  /* ---------- estado ---------- */
  let D = null, P = null, S = { votes: [], notes: [], ideas: [] };
  let map = null, mapReady = false, markers = [], routeId = null, view = 'roteiro', days = [], dayIdx = -1, legIdx = -1, antsTimer = null;
  const theme = () => load('rota27.theme', 'light');
  const col = (r) => (PALETTE[r.id] || ['#10151C', '#EDEFF2'])[theme() === 'dark' ? 1 : 0];
  const R = () => D.routes.find(r => r.id === routeId);

  /* ---------- backends ---------- */
  const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const backends = {
    local: {
      needsAuth: false, async init() {},
      user() { const w = load('rota27.who', 'andre'); return { id: w, ...PEOPLE[w] }; },
      setWho(w) { store('rota27.who', w); }, async signOut() {},
      async loadContent() { if (!window.ROTA27) throw new Error('routes.js'); return window.ROTA27; },
      async loadState() { return { votes: load('rota27.votes', []), notes: load('rota27.notes', []), ideas: load('rota27.ideas', []) }; },
      _p(u) { return { initial: u.initial, display_name: u.name }; },
      async setVote(route_id, value) { const u = this.user(); const v = load('rota27.votes', []).filter(x => !(x.user_id === u.id && x.route_id === route_id)); v.push({ user_id: u.id, route_id, value, profiles: this._p(u) }); store('rota27.votes', v); },
      async setNote(body) { const u = this.user(); const n = load('rota27.notes', []).filter(x => x.user_id !== u.id); n.push({ user_id: u.id, body, profiles: this._p(u) }); store('rota27.notes', n); },
      async addIdea(i) { const u = this.user(); const a = load('rota27.ideas', []); a.unshift({ id: Date.now(), user_id: u.id, created_at: new Date().toISOString(), profiles: this._p(u), ...i }); store('rota27.ideas', a); },
      subscribe(cb) { window.addEventListener('storage', cb); }
    },
    supabase: {
      needsAuth: true, c: null, s: null,
      async init() {
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
        this.c = window.supabase.createClient(CFG.supabase.url, CFG.supabase.anonKey);
        const { data } = await this.c.auth.getSession(); this.s = data.session;
        this.c.auth.onAuthStateChange((_e, s) => { this.s = s; });
      },
      user() { const u = this.s?.user; if (!u) return null; const m = u.user_metadata || {}; return { id: u.id, initial: (m.initial || u.email[0]).toUpperCase(), name: m.name || u.email }; },
      async signIn(email, password) { const { error } = await this.c.auth.signInWithPassword({ email, password }); return !error; },
      async signOut() { await this.c.auth.signOut(); },
      async loadContent() { const { data, error } = await this.c.from('r27_content').select('payload').eq('id', 'rota27').single(); if (error) throw error; return data.payload; },
      async loadState() {
        const Pf = 'profiles:r27_profiles(initial,display_name)';
        const [v, n, i] = await Promise.all([
          this.c.from('r27_votes').select(`user_id,route_id,value,${Pf}`),
          this.c.from('r27_notes').select(`user_id,body,updated_at,${Pf}`),
          this.c.from('r27_ideas').select(`id,user_id,route_id,stop_place,kind,title,body,link,amount,currency,created_at,${Pf}`).order('created_at', { ascending: false })
        ]);
        return { votes: v.data || [], notes: n.data || [], ideas: i.data || [] };
      },
      async setVote(route_id, value) { await this.c.from('r27_votes').upsert({ user_id: this.user().id, route_id, value }, { onConflict: 'user_id,route_id' }); },
      async setNote(body) { await this.c.from('r27_notes').upsert({ user_id: this.user().id, body }, { onConflict: 'user_id' }); },
      async addIdea(i) { await this.c.from('r27_ideas').insert({ user_id: this.user().id, ...i, link: i.link || null }); },
      subscribe(cb) { const ch = this.c.channel('rota27'); ['r27_votes', 'r27_notes', 'r27_ideas'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, cb)); ch.subscribe(); }
    }
  };
  const be = backends[MODE] || backends.local;
  const me = () => be.user();

  /* ---------- tema ---------- */
  function applyTheme(t, rerender) {
    document.documentElement.dataset.theme = t;
    $('#themeBtn').innerHTML = icon(t === 'dark' ? 'i-sun' : 'i-moon');
    $('#themeBtn').setAttribute('aria-label', t === 'dark' ? 'Tema claro' : 'Tema escuro');
    store('rota27.theme', t);
    if (rerender && D) { paintMap(); render(); }
  }
  $('#themeBtn').addEventListener('click', () => applyTheme(theme() === 'dark' ? 'light' : 'dark', true));
  applyTheme(theme(), false);

  /* ---------- gate ---------- */
  const gate = $('#gate'), gateErr = $('#gateErr'), gateBtn = $('#gateBtn');
  $('#gateForm').addEventListener('submit', async (e) => {
    e.preventDefault(); gateErr.hidden = true; gateBtn.disabled = true; gateBtn.textContent = 'Entrando…';
    const ok = await be.signIn($('#gEmail').value.trim(), $('#gPass').value);
    gateBtn.disabled = false; gateBtn.textContent = 'Entrar';
    if (!ok) { gateErr.textContent = 'E-mail ou senha incorretos.'; gateErr.hidden = false; $('#gPass').value = ''; $('#gPass').focus(); return; }
    start();
  });
  $('#outBtn').addEventListener('click', async () => { await be.signOut(); location.reload(); });

  async function start() {
    try { await be.init(); } catch (e) { console.error(e); }
    if (be.needsAuth && !me()) { gate.hidden = false; $('#app').hidden = true; $('#gEmail').focus(); return; }
    try { D = await be.loadContent(); } catch (e) { gate.hidden = false; gateErr.textContent = 'Não foi possível carregar o conteúdo.'; gateErr.hidden = false; return; }
    P = D.places; S = await be.loadState();
    gate.hidden = true; $('#app').hidden = false; $('#outBtn').hidden = !be.needsAuth;
    $('#foot').textContent = `${be.needsAuth ? 'Supabase · RLS' : 'modo local'} · trechos Rome2Rio set/2026 · v0.2`;
    renderWho();
    const fromHash = (location.hash.match(/rota=([a-z]+)/) || [])[1];
    routeId = D.routes.some(r => r.id === fromHash) ? fromHash : D.routes[0].id;
    setRoute(routeId); setView('roteiro');
    buildMap();
    be.subscribe(async () => { S = await be.loadState(); if (view !== 'roteiro') render(); else renderIdeas(); });
  }

  function renderWho() {
    const who = $('#who'), u = me();
    if (be.needsAuth) { who.innerHTML = `<span class="avatar avatar--me" title="${esc(u.name)}">${esc(u.initial)}</span><span class="who__name">${esc(u.name)}</span>`; return; }
    who.innerHTML = Object.entries(PEOPLE).map(([k, p]) => `<button type="button" class="avatar ${u.id === k ? 'avatar--me' : ''}" data-who="${k}" aria-pressed="${u.id === k}" aria-label="Eu sou ${p.name}" title="${p.name}">${p.initial}</button>`).join('');
    who.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { be.setWho(b.dataset.who); renderWho(); render(); }));
  }

  /* ---------- linha do tempo (derivada dos dados) ---------- */
  function buildDays(r) {
    const m = D.meta, out = [];
    const dnum = (d) => +d.split('/')[0];
    const wd = (d) => WD[new Date(2027, 6, dnum(d)).getDay()];
    const mk = (o) => ({ bullets: [], moves: [], sides: [], ...o, wd: wd(o.date), d: dnum(o.date) });
    out.push(mk({ date: m.saida.data, kind: 'out', title: 'Embarque no Brasil', place: null, desc: `${m.saida.de} ${m.saida.hora} · ${m.saida.cia} ${m.saida.tipo} · ${m.saida.dur} · chega ${m.saida.para} ${m.saida.chega}` }));
    let li = 0;
    const legs = r.legs;
    r.stops.forEach((s, si) => {
      const chain = [], sides = [];
      while (li < legs.length) {
        const L = legs[li];
        if (L.note) { sides.push(L); li++; continue; }
        chain.push(L); li++;
        if (L.to === s.place) break;
      }
      while (li < legs.length && legs[li].note) { sides.push(legs[li]); li++; }
      const first = dnum(s.in), last = dnum(s.out);
      const dated = {}, generic = [];
      s.bullets.forEach(b => { const mm = b.match(/^(\d{2})\/07\s*[—-]\s*(.*)$/); if (mm) (dated[+mm[1]] = dated[+mm[1]] || []).push(mm[2]); else generic.push(b); });
      for (let d = first; d < last; d++) {
        const date = `${String(d).padStart(2, '0')}/07`;
        const arrive = d === first;
        out.push(mk({ date, kind: arrive ? (si === 0 ? 'arrive' : 'move') : 'stay', title: s.titulo, place: s.place, stop: s, si, nights: s.nights,
          moves: arrive ? chain : [], sides: arrive ? sides : [], bullets: [...(arrive ? generic : []), ...(dated[d] || [])] }));
      }
    });
    const lastStop = r.stops[r.stops.length - 1];
    out.push(mk({ date: m.volta.data, kind: 'back', title: 'Voo de volta', place: lastStop.place, stop: lastStop, si: r.stops.length - 1, desc: `${m.volta.de} ${m.volta.hora} · ${m.volta.cia} ${m.volta.tipo} · ${m.volta.dur}`, bullets: (lastStop.bullets.filter(b => b.startsWith(m.volta.data)).map(b => b.replace(/^\d{2}\/07\s*[—-]\s*/, ''))) }));
    out.push(mk({ date: m.volta.chega.split(' ')[0], kind: 'home', title: 'Chegada em casa', place: null, desc: `${m.volta.para} ${m.volta.chega.split('· ')[1] || ''}` }));
    return out;
  }

  /* ---------- mapa ---------- */
  const STYLES = { light: 'https://tiles.openfreemap.org/styles/positron', dark: 'https://tiles.openfreemap.org/styles/positron' };
  function buildMap() {
    map = new maplibregl.Map({ container: 'map', style: STYLES.light, center: [17.5, 40.6], zoom: 4.6, attributionControl: { compact: true }, cooperativeGestures: false });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
    map.on('load', () => { mapReady = true; paintMap(); applyVisibility(); buildMarkers(R()); fitRoute(); if (view === 'comparar') fitAll(); else if (dayIdx >= 0) selectDay(dayIdx); });

  const arc = (a, b) => {

  const legCoords = (L) => { const a = P[L.from], b = P[L.to]; const A = [a.lng, a.lat], B = [b.lng, b.lat]; return L.mode === 'plane' ? arc(A, B) : [A, B]; };
  function fc(r) {
    return { type: 'FeatureCollection', features: r.legs.map((L, i) => P[L.from] && P[L.to] ? { type: 'Feature', properties: { i, mode: L.mode, side: !!L.note, route: r.id, label: `${P[L.from].n} → ${P[L.to].n} · ${MODEI[L.mode][1]} · ${fmtMin(L.min)}` }, geometry: { type: 'LineString', coordinates: legCoords(L) } } : null).filter(Boolean) };
  }
  const W = ['interpolate', ['linear'], ['zoom'], 4, 2.2, 8, 3.6, 12, 5.5];
  const WC = ['interpolate', ['linear'], ['zoom'], 4, 5, 8, 7, 12, 9.5];
  function paintMap() {
    if (!map.isStyleLoaded()) return;

    D.routes.forEach(r => {
      const id = `route-${r.id}`, c = col(r);
      if (!map.getSource(id)) map.addSource(id, { type: 'geojson', data: fc(r) });
      const add = (lid, filter, paint, layout) => { if (map.getLayer(lid)) { Object.entries(paint).forEach(([k, v]) => map.setPaintProperty(lid, k, v)); return; } map.addLayer({ id: lid, type: 'line', source: id, filter, paint, layout: { 'line-cap': 'round', 'line-join': 'round', ...layout } }); };
      add(`${id}-casing`, ['!=', ['get', 'mode'], 'plane'], { 'line-color': cas, 'line-width': WC, 'line-opacity': 0.9 }, {});
      add(`${id}-land`, ['all', ['!=', ['get', 'mode'], 'plane'], ['!=', ['get', 'mode'], 'ferry']], { 'line-color': c, 'line-width': W }, {});
      add(`${id}-ferry`, ['==', ['get', 'mode'], 'ferry'], { 'line-color': c, 'line-width': W, 'line-dasharray': [2, 2] }, {});

        map.on('mouseenter', lid, (e) => { map.getCanvas().style.cursor = 'pointer'; popup.setLngLat(e.lngLat).setHTML(esc(e.features[0].properties.label)).addTo(map); });

        map.on('mouseleave', lid, () => { map.getCanvas().style.cursor = ''; popup.remove(); });

  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
  function applyVisibility() {

      ['casing', 'land', 'ferry', 'plane'].forEach(k => { const lid = `${id}-${k}`; if (map.getLayer(lid)) { map.setLayoutProperty(lid, 'visibility', on ? 'visible' : 'none'); map.setPaintProperty(lid, 'line-opacity', view === 'comparar' ? (r.id === routeId ? 1 : .55) : (k === 'casing' ? .9 : 1)); } });

  function routeBounds(r) { const b = new maplibregl.LngLatBounds(); r.stops.forEach(s => b.extend([P[s.place].lng, P[s.place].lat])); b.extend([P.fco.lng, P.fco.lat]); return b; }
  function padding() { const mobile = innerWidth <= 900; return mobile ? { top: 80, bottom: Math.round(innerHeight * .54) + 24, left: 30, right: 30 } : { top: 130, bottom: 70, left: 70, right: 90 }; }
  function fitRoute(r = R()) { if (!mapReady) return; map.fitBounds(routeBounds(r), { padding: padding(), duration: reduced ? 0 : 900, maxZoom: 8 }); }
  function fitAll() { const b = new maplibregl.LngLatBounds(); D.routes.forEach(r => b.extend(routeBounds(r))); map.fitBounds(b, { padding: padding(), duration: reduced ? 0 : 900 }); }

  /* ---------- rota / vista / dia ---------- */
  function setRoute(id, { keepView = false } = {}) {

  function setView(v) {

  function selectDay(i, { scroll = false, fromScroll = false } = {}) {
    if (i < 0 || i >= days.length) return;
    const d = days[i], r = R(), c = col(r);
    dayIdx = i;
    document.querySelectorAll('.day').forEach(el => el.classList.toggle('is-active', +el.dataset.i === i));
    const where = d.kind === 'out' ? 'Guarulhos → Roma' : d.kind === 'home' ? 'Chegada em Guarulhos' : d.moves.length ? `${esc(P[d.moves[0].from].n)} → ${esc(d.title)}` : esc(d.title);
    $('#routeCard').innerHTML = `<div class="route-card__t"><span class="chip" style="background:${c};color:#fff">D${i}</span>${d.d} ${d.wd} · ${where}</div><div class="route-card__s">${esc(r.nome)}${d.nights && (d.kind === 'arrive' || d.kind === 'move') ? ` · ${d.nights} ${d.nights === 1 ? 'noite' : 'noites'}` : ''}</div>`;
    markers.forEach((m, k) => { const el = m.getElement(); const isGate = k === 0; el.classList.toggle('is-active', isGate ? (d.kind === 'out' || d.kind === 'back' || d.kind === 'home') : (k - 1 === d.si && d.kind !== 'out' && d.kind !== 'home')); });

  }
  let suppress = false, supT = null, scrollRaf = null;
  const rhH = () => ($('.rh')?.offsetHeight || 0);
  /* dia ativo segue o ponteiro: o dia sob o cursor manda no mapa (ao passar o mouse ou ao rolar com o cursor parado).

  const panelEl = $('#panel');

  const follow = (i) => { clearTimeout(hoverT); if (i < 0 || i === dayIdx) return; hoverT = setTimeout(() => { if (view === 'roteiro' && !suppress && i !== dayIdx) selectDay(i, { fromScroll: true }); }, 90); };

  /* ---------- guia (Wikipédia) ---------- */
  const GUIA = () => D.guia || window.ROTA27_GUIA || {};
  function guide(rid, place) { let g = GUIA()[`${rid}/${place}`]; if (g && g.ref) g = GUIA()[g.ref]; return g || null; }
  const wikiCache = {};
  async function wiki(spec) {
    const mm = spec.match(/^(pt|en|it|el|hr|sq|tr|sl):(.+)$/); const lang = mm ? mm[1] : 'pt', title = mm ? mm[2] : spec, key = `${lang}:${title}`;
    if (wikiCache[key]) return wikiCache[key];
    const stored = load(`rota27.wiki.${key}`, null); if (stored) return (wikiCache[key] = stored);
    const tryFetch = async (l, t) => { const r = await fetch(`https://${l}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g, '_'))}`); if (!r.ok) return null; const j = await r.json(); if (j.type === 'disambiguation') return null; return { title: j.title, extract: (j.extract || '').slice(0, 240), img: j.thumbnail?.source || null, url: j.content_urls?.desktop?.page || `https://${l}.wikipedia.org/wiki/${encodeURIComponent(t)}` }; };

    wikiCache[key] = res; store(`rota27.wiki.${key}`, res); return res;

  function headerHTML(r) {
    const c = col(r), nights = r.stops.reduce((a, s) => a + s.nights, 0);

  function timelineHTML(r) {

          ${d.sides.length ? `<div class="moves">${d.sides.map(L => `<div class="move move--side">${mIcon(L.mode, 'ic ic--s')}<div><div class="move__t">${esc(L.note)} · ${esc(P[L.to].n)}</div><div class="move__c">${esc(L.carrier || '')}${L.alt ? ' · ' + esc(L.alt) : ''}</div></div><div class="move__d">${fmtMin(L.min)}</div></div>`).join('')}</div>` : ''}
          ${d.stop && (d.kind === 'arrive' || d.kind === 'move') && guide(r.id, d.place) ? guideHTML(guide(r.id, d.place), d) : ''}
          ${d.bullets.length ? `<ul>${d.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
          ${d.stop && (d.kind === 'arrive' || d.kind === 'move') ? `<div class="ideas" data-ideas="${d.place}"></div><div class="day__foot"><button class="btn btn--ghost" type="button" data-add="${d.place}">${icon('i-plus', 'ic ic--s')}Ideia · custo · hotel · dúvida</button></div>` : ''}
        </div></article>`;
    }).join('') + `</div><div class="risks"><p class="lbl">Riscos e mitigações</p><ul>${r.riscos.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div style="height:24px"></div>`;
  }
  function legsHTML(r) {
    const main = r.legs.filter(l => !l.note), total = main.reduce((a, l) => a + l.min, 0), by = {};
    main.forEach(l => by[l.mode] = (by[l.mode] || 0) + 1);
    return `<div class="legs" style="--rc:${col(r)}"><div class="stats" style="margin:4px 0 8px"><div class="stat"><b>${main.length}</b><span>trechos</span></div><div class="stat"><b>${fmtMin(total)}</b><span>em trânsito</span></div><div class="stat"><b>${Object.keys(by).map(m => `${by[m]}<span style="display:inline-flex;vertical-align:-2px;margin:0 6px 0 2px">${mIcon(m, 'ic ic--s')}</span>`).join('')}</b><span>por modo</span></div></div>` +
      r.legs.map((L, i) => `<div class="legrow ${i === legIdx ? 'is-active' : ''}" data-leg="${i}" role="button" tabindex="0"><span class="legrow__n mono">${i + 1}</span><div><div class="legrow__t">${esc(P[L.from].n)} → ${esc(P[L.to].n)}${L.note ? ` <span class="chip">${esc(L.note)}</span>` : ''}</div><div class="legrow__c">${MODEI[L.mode][1]} · ${esc(L.carrier || '—')}${L.alt ? ' · ' + esc(L.alt) : ''}</div></div><div class="legrow__d">${fmtMin(L.min)}</div></div>`).join('') + `</div>`;
  }
  function compareHTML() {
    const order = ['recomendado', 'finalista', 'surpresa', 'sobrevivente', 'fria', 'condicional'];
    const rs = [...D.routes].sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));
    const k = D.meta.cambio.eurBrl;
    return `<div class="cmp"><p class="cmp__intro">Sete rotas, sete critérios de 1 a 5. Passe o mouse para destacar no mapa; "Ver roteiro" abre o dia a dia.</p>` + rs.map(r => {
      const c = col(r), nights = r.stops.reduce((a, s) => a + s.nights, 0);
      return `<section class="card ${r.status === 'recomendado' ? 'card--top' : ''}" style="--rc:${c}" data-route="${r.id}">
        <div class="card__h"><div style="flex:1"><div class="card__name">${esc(r.nome)}</div><div class="card__sub">${esc(r.sub)}</div></div><span class="chip ${STATUS[r.status] || ''}">${esc(r.statusLabel)}</span></div>
        <p class="card__sig">${esc(r.assinatura)}</p>
        <div class="card__stats"><div class="stat"><b>${nights}</b><span>noites</span></div><div class="stat"><b>${r.stops.length}</b><span>bases</span></div><div class="stat"><b>${r.paises.join('·')}</b><span>países</span></div><div class="stat"><b>€${r.custoEur[0].toLocaleString('pt-BR')}–${r.custoEur[1].toLocaleString('pt-BR')}</b><span>≈ R$${Math.round(r.custoEur[0] * k / 1000)}–${Math.round(r.custoEur[1] * k / 1000)} mil</span></div></div>
        <div class="crit">${D.criterios.map(cr => { const v = r.scores[cr.k]; return `<div class="crit__row"><span title="${esc(cr.d)}">${esc(cr.n)}</span><span class="meter" data-v="${v}" style="--v:${v}"><i></i></span><span class="crit__v">${v}</span></div>`; }).join('')}</div>
        <p class="card__risk">${esc(r.custoNota)} · ${esc(r.riscos[0])}</p>
        <div class="card__act"><button class="btn btn--primary" type="button" data-go="${r.id}">${icon('i-map', 'ic ic--s')}Ver roteiro</button></div>
      </section>`; }).join('') + `</div>`;
  }
  function decideHTML() {
    const u = me();
    const people = be.needsAuth ? Object.values(S.votes.reduce((a, v) => { a[v.user_id] = { id: v.user_id, ...v.profiles }; return a; }, { [u.id]: { id: u.id, initial: u.initial, display_name: u.name } })) : Object.entries(PEOPLE).map(([id, p]) => ({ id, initial: p.initial, display_name: p.name }));
    const cols = people.slice(0, 2);
    const votes = `<div class="votes" style="grid-template-columns:1fr ${cols.map(() => 'auto').join(' ')}"><span></span>${cols.map(p => `<span class="vh lbl" title="${esc(p.display_name)}">${esc(p.initial)}</span>`).join('')}` +
      D.routes.map(r => `<div class="vrow"><div class="vname"><span class="dot" style="--rc:${col(r)}"></span>${esc(r.nome)}</div>${cols.map(p => { const v = S.votes.find(x => x.user_id === p.id && x.route_id === r.id); const mine = p.id === u.id; return `<button class="heart" type="button" aria-pressed="${!!(v && v.value)}" aria-label="${mine ? 'Votar em' : 'Voto de ' + esc(p.display_name) + ' em'} ${esc(r.nome)}" data-vote="${r.id}" ${mine ? '' : 'disabled'}>${icon('i-heart', 'ic ic--s')}</button>`; }).join('')}</div>`).join('') + `</div>`;
    const others = S.notes.filter(n => n.user_id !== u.id && n.body);
    const mine = S.notes.find(n => n.user_id === u.id);
    const notes = `<div class="inbox">${others.map(n => `<div class="notecard"><div class="notecard__h"><span class="avatar avatar--xs">${esc(n.profiles?.initial)}</span>${esc(n.profiles?.display_name)}</div><p>${esc(n.body)}</p></div>`).join('') || '<p class="empty">Nenhuma nota da outra pessoa ainda.</p>'}</div>
      <div class="field" style="margin-top:12px"><label for="noteMine">Sua nota</label><textarea id="noteMine">${esc(mine ? mine.body : '')}</textarea></div><div class="idea-form__act" style="margin-top:8px"><button class="btn" type="button" id="noteSave">Salvar nota</button></div>`;
    const byRoute = {}; S.ideas.forEach(i => (byRoute[i.route_id] = byRoute[i.route_id] || []).push(i));
    const inbox = Object.keys(byRoute).length ? Object.entries(byRoute).map(([rid, items]) => { const r = D.routes.find(x => x.id === rid); return `<div class="inbox__g">${esc(r ? r.nome : rid)}</div>` + items.map(i => ideaHTML(i, true)).join(''); }).join('') : '<p class="empty">Nenhuma ideia lançada ainda. Elas nascem no Roteiro, em cada base.</p>';
    return `<div class="dec"><section><h3>Votos</h3>${votes}</section><section><h3>Notas</h3>${notes}</section><section><h3>Ideias, custos e hotéis</h3><div class="inbox">${inbox}</div></section></div>`;
  }
  const ideaHTML = (i, withPlace) => `<div class="idea"><span class="avatar avatar--xs" title="${esc(i.profiles?.display_name)}">${esc(i.profiles?.initial || '?')}</span><div><div class="idea__kind">${esc(KINDS[i.kind] || i.kind)}${withPlace && i.stop_place && P[i.stop_place] ? ' · ' + esc(P[i.stop_place].n) : ''}</div><div class="idea__t">${esc(i.title)}</div>${i.body ? `<div class="idea__b">${esc(i.body)}</div>` : ''}${i.link ? `<div class="idea__b"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.link.replace(/^https?:\/\//, '').slice(0, 44))}</a></div>` : ''}</div>${i.amount ? `<div class="idea__amt">${esc(i.currency || '€')} ${Number(i.amount).toLocaleString('pt-BR')}</div>` : '<span></span>'}</div>`;
  function renderIdeas() { document.querySelectorAll('[data-ideas]').forEach(box => { box.innerHTML = S.ideas.filter(i => i.route_id === routeId && i.stop_place === box.dataset.ideas).map(i => ideaHTML(i, false)).join(''); }); }

  function wire(r) {
    const el = $('#panelContent');
    // seletor de rota
    const sel = $('#rsel'); if (sel) {
      const btn = $('#rselBtn'), list = $('#rselList');
      const close = () => { sel.dataset.open = 'false'; btn.setAttribute('aria-expanded', 'false'); list.hidden = true; };
      btn.addEventListener('click', () => { const open = sel.dataset.open !== 'true'; sel.dataset.open = String(open); btn.setAttribute('aria-expanded', String(open)); list.hidden = !open; if (open) list.querySelector('[aria-selected=true]')?.focus(); });
      list.querySelectorAll('.rsel__opt').forEach(o => o.addEventListener('click', () => { close(); setRoute(o.dataset.id); }));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); }, { once: true });
      document.addEventListener('click', (e) => { if (!sel.contains(e.target)) close(); }, { once: true });
    }
    // dias
    if (view === 'roteiro') {
      el.querySelectorAll('.day').forEach(d => { d.addEventListener('click', (e) => { if (e.target.closest('button, a, form, .hl-row')) return; selectDay(+d.dataset.i); }); d.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === d) { e.preventDefault(); selectDay(+d.dataset.i); } }); });
      el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => openIdeaForm(b.closest('.day'), b.dataset.add)));
      renderIdeas();
      if (guideObs) guideObs.disconnect();
      guideObs = new IntersectionObserver((entries) => entries.forEach(e => { if (e.isIntersecting) hydrate(e.target); }), { root: $('#panel'), rootMargin: '300px 0px' });
      el.querySelectorAll('.guide').forEach(g => guideObs.observe(g));
      if (dayIdx < 0) selectDay(0); else document.querySelector(`.day[data-i="${dayIdx}"]`)?.classList.add('is-active');
    }
    if (view === 'trechos') el.querySelectorAll('.legrow').forEach(row => { const go = () => { legIdx = +row.dataset.leg; el.querySelectorAll('.legrow').forEach(x => x.classList.toggle('is-active', x === row)); const L = r.legs[legIdx]; setActiveLegs([L]); const b = new maplibregl.LngLatBounds(); legCoords(L).forEach(pt => b.extend(pt)); map.fitBounds(b, { padding: padding(), duration: reduced ? 0 : 800, maxZoom: 9.5 }); }; row.addEventListener('click', go); row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
    if (view === 'comparar') {
      el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { setRoute(b.dataset.go); setView('roteiro'); }));
      el.querySelectorAll('.card').forEach(c => { c.addEventListener('mouseenter', () => hi(c.dataset.route)); c.addEventListener('mouseleave', () => hi(null)); });
    }
    if (view === 'decidir') {
      el.querySelectorAll('[data-vote]:not([disabled])').forEach(b => b.addEventListener('click', async () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); await be.setVote(b.dataset.vote, on); S = await be.loadState(); render(); }));
      $('#noteSave')?.addEventListener('click', async () => { const b = $('#noteSave'); b.disabled = true; b.textContent = 'Salvando…'; await be.setNote($('#noteMine').value.trim()); S = await be.loadState(); render(); });
    }
  }
  function hi(id) {
    if (!mapReady || view !== 'comparar') return;
    D.routes.forEach(r => ['land', 'ferry', 'plane'].forEach(k => { const lid = `route-${r.id}-${k}`; if (map.getLayer(lid)) map.setPaintProperty(lid, 'line-opacity', id ? (r.id === id ? 1 : .18) : .55); }));
  }
  function openIdeaForm(dayEl, stop_place) {
    if (dayEl.querySelector('.idea-form')) return;
    let kind = 'ideia';
    const f = document.createElement('form'); f.className = 'idea-form'; f.noValidate = true;
    f.innerHTML = `<div class="seg" role="radiogroup" aria-label="Tipo">${Object.entries(KINDS).map(([k, v]) => `<button type="button" role="radio" aria-pressed="${k === 'ideia'}" data-k="${k}">${v}</button>`).join('')}</div>
      <div class="field"><label for="it-${stop_place}">Título</label><input id="it-${stop_place}" name="title" required maxlength="120"></div>
      <div class="field"><label for="ib-${stop_place}">Detalhe</label><textarea id="ib-${stop_place}" name="body" maxlength="1000"></textarea></div>
      <div class="idea-form__row"><div class="field"><label for="il-${stop_place}">Link</label><input id="il-${stop_place}" name="link" type="url" placeholder="https://"></div><div class="field"><label for="ia-${stop_place}">Valor (€)</label><input id="ia-${stop_place}" name="amount" type="number" inputmode="decimal" min="0" step="1"></div></div>
      <p class="err" hidden>Dê um título.</p>
      <div class="idea-form__act"><button class="btn btn--ghost" type="button" data-cancel>Cancelar</button><button class="btn btn--primary" type="submit">Salvar</button></div>`;
    dayEl.querySelector('.day__foot').before(f);
    f.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { kind = b.dataset.k; f.querySelectorAll('[data-k]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
    f.querySelector('[data-cancel]').addEventListener('click', () => f.remove());
    const onEsc = (e) => { if (e.key === 'Escape') { f.remove(); document.removeEventListener('keydown', onEsc); } }; document.addEventListener('keydown', onEsc);
    f.addEventListener('submit', async (e) => {
      e.preventDefault(); const fd = new FormData(f), title = (fd.get('title') || '').trim();
      if (!title) { f.querySelector('.err').hidden = false; f.title.focus(); return; }
      const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Salvando…';
      await be.addIdea({ route_id: routeId, stop_place, kind, title, body: (fd.get('body') || '').trim(), link: (fd.get('link') || '').trim(), amount: fd.get('amount') ? Number(fd.get('amount')) : null, currency: '€' });
      S = await be.loadState(); f.remove(); document.removeEventListener('keydown', onEsc); renderIdeas();
    });
    f.querySelector('input[name=title]').focus();
  }

  /* ---------- bottom sheet (mobile) ---------- */
  (() => {
    const panel = $('#panel'), handle = $('#handle'); let y0 = 0, st = 'half';
    const set = (s) => { st = s; panel.dataset.sheet = s; setTimeout(() => map && map.resize(), 280); };
    handle.addEventListener('click', () => set(st === 'full' ? 'half' : 'full'));
    handle.addEventListener('pointerdown', (e) => { y0 = e.clientY; handle.setPointerCapture(e.pointerId); });
    handle.addEventListener('pointerup', (e) => { const dy = e.clientY - y0; if (Math.abs(dy) < 30) return; if (dy < 0) set(st === 'peek' ? 'half' : 'full'); else set(st === 'full' ? 'half' : 'peek'); });
  })();

  start();
})();
</script>
</body>
</html>
